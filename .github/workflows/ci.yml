name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Database migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Applies every migration from scratch, then runs the pgTAP suite in supabase/tests.
      - run: pnpm db:start
      - run: pnpm db:test

  e2e:
    name: End-to-end (auth and role guards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gta6/web exec playwright install --with-deps chromium

      - name: Start local Supabase (database, auth, REST only)
        run: >-
          pnpm supabase start
          -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta,storage-api

      # Local Supabase keys are per-run development defaults, written to an ignored file and
      # never echoed.
      - name: Write apps/web/.env.local from the local stack
        run: |
          status="$(pnpm -s supabase status -o json)"
          {
            echo "APP_ENV=local"
            echo "LOG_LEVEL=info"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<<"$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<<"$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<<"$status")"
          } > apps/web/.env.local

      - run: pnpm --filter @gta6/web build
      - name: Start web server
        run: |
          pnpm --filter @gta6/web start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 1; done
          cat web.log; exit 1
      - run: pnpm --filter @gta6/web test:e2e

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" gitleaks

      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
